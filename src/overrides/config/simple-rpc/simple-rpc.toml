#General Config Section. See https://srpc.fdd-docs.com/introduction/
[general]
	applicationID = "1525557670533136515"
	enabled = true
	debugging = false
	launcherIntegration = false
	rpcImageServer = false
	rpcImageServerUrl = "https://rpcavatar.firstdark.dev"
	#Internal Version Number. NO TOUCHY!
	version = 27

#Game loading
[init]
	#Enable/Disable the init event
	enabled = true

	#List of RPCs that will be displayed at random
	[[init.presence]]
		type = "PLAYING"
		description = "Assembly Line SMP"
		state = "Game starting..."
		largeImageKey = ["https://raw.githubusercontent.com/Assembly-Line-SMP/Textures/refs/heads/main/textures/icon3.png"]
		largeImageText = "Assembly Line SMP | Create modded Minecraft {{game.version}}"
		smallImageKey = ["{{images.player}}"]
		smallImageText = "{{player.name}}"
		streamingActivityUrl = "https://twitch.tv/twitch"
		buttons = [{ label = "Open Assembly Line SMP", url = "https://modrinth.com/server/assembly-line-smp/" }]

